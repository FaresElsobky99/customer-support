name: Backend CI/CD

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:

  # =========================================================
  # 1. UNIT + API TESTS
  # =========================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and API tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run pytest tests/ -m "not integration"


  # =========================================================
  # 2. INTEGRATION TESTS
  # =========================================================
  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: uv run pytest tests/integration/ -m integration


  # =========================================================
  # 3. BUILD DOCKER IMAGE
  # =========================================================
  build:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t customer-support-api .


  # =========================================================
  # 4. PUSH IMAGE TO GITHUB CONTAINER REGISTRY
  # =========================================================
  publish:
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/fareselsobky99/customer-support-backend:latest \
            .

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/fareselsobky99/customer-support-frontend:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push ghcr.io/fareselsobky99/customer-support-backend:latest

      - name: Push frontend image
        run: |
          docker push ghcr.io/fareselsobky99/customer-support-frontend:latest