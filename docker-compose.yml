services:
  backend:
    build: .
    container_name: customer-support-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: customer-support-frontend

    ports:
      - "4200:80"

    depends_on:
      - backend

    restart: unless-stopped