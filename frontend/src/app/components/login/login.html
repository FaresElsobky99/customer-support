<section class="login-page">
  <div class="card login-card">
    <div class="page-heading">
      <p class="eyebrow">Customer support</p>
      <h1>Sign in</h1>
      <p>Use your customer account to view and create support tickets.</p>
    </div>

    <form (ngSubmit)="submit()">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      />

      @if (errorMessage) {
        <p class="message message--error" role="alert">{{ errorMessage }}</p>
      }

      <button class="button button--primary button--full" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Login' }}
      </button>
    </form>
  </div>
</section>
