[project]
name = "mcp-customer-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "httpx>=0.28.0",
    "mcp>=2.0.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

# The agent's LLM provider is pluggable (backend/app/agent/llm/). Gemini is the default and
# needs no extra install. When backend/app/agent/llm/claude.py is added, move `anthropic`
# out of the dependencies above into an optional extra:
#   [project.optional-dependencies]
#   claude = ["anthropic>=1.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that require a live database or another external service",
]
